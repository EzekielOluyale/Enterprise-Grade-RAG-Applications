name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main, deployment]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'enterprise-rag' }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER || 'rag-cluster' }}
  ECS_SERVICE_API: ${{ secrets.ECS_SERVICE_API || 'rag-api' }}
  BACKEND_URL: ${{ secrets.BACKEND_URL }}

jobs:
  deploy:
    name: Build, Push, and Deploy to ECS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Render task definition placeholders
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}

          # --- Secrets ---
          GROQ_API_KEY_ARN: ${{ secrets.GROQ_API_KEY_ARN }}
          QDRANT_URL_ARN: ${{ secrets.QDRANT_URL_ARN }}
          QDRANT_API_KEY_ARN: ${{ secrets.QDRANT_API_KEY_ARN }}
          PORTKEY_API_KEY_ARN: ${{ secrets.PORTKEY_API_KEY_ARN }}
          LOGFIRE_TOKEN_ARN: ${{ secrets.LOGFIRE_TOKEN_ARN }}
          LANGSMITH_API_KEY_ARN: ${{ secrets.LANGSMITH_API_KEY_ARN }}
          GEMINI_API_KEY_ARN: ${{ secrets.GEMINI_API_KEY_ARN }}
          DATABASE_URL_ARN: ${{ secrets.DATABASE_URL_ARN }}
          RAG_API_KEY_ARN: ${{ secrets.RAG_API_KEY_ARN }}
          GCP_SERVICE_ACCOUNT_KEY_ARN: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_ARN }}

          # --- Environment Variables
          GROQ_MODEL: ${{ vars.GROQ_MODEL }} 
          PORTKEY_CONFIG_ID: ${{ vars.PORTKEY_CONFIG_ID }}
          PORTKEY_CHAT_CONFIG_ID: ${{ vars.PORTKEY_CHAT_CONFIG_ID }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VERTEXAI_EMBEDDING_MODEL: ${{ vars.VERTEXAI_EMBEDDING_MODEL }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}

        run: |
          render() {
            sed \
              -e "s|<IMAGE_NAME>|$IMAGE_URI|g" \
              -e "s|<AWS_REGION>|$AWS_REGION|g" \
              -e "s|<GROQ_API_KEY_ARN>|$GROQ_API_KEY_ARN|g" \
              -e "s|<QDRANT_URL_ARN>|$QDRANT_URL_ARN|g" \
              -e "s|<QDRANT_API_KEY_ARN>|$QDRANT_API_KEY_ARN|g" \
              -e "s|<PORTKEY_API_KEY_ARN>|$PORTKEY_API_KEY_ARN|g" \
              -e "s|<LOGFIRE_TOKEN_ARN>|$LOGFIRE_TOKEN_ARN|g" \
              -e "s|<LANGSMITH_API_KEY_ARN>|$LANGSMITH_API_KEY_ARN|g" \
              -e "s|<GEMINI_API_KEY_ARN>|$GEMINI_API_KEY_ARN|g" \
              -e "s|<DATABASE_URL_ARN>|$DATABASE_URL_ARN|g" \
              -e "s|<RAG_API_KEY_ARN>|$RAG_API_KEY_ARN|g" \
              -e "s|<GCP_SERVICE_ACCOUNT_KEY_ARN>|$GCP_SERVICE_ACCOUNT_KEY_ARN|g" \

              -e "s|<GROQ_MODEL>|$GROQ_MODEL|g" \
              -e "s|<PORTKEY_CONFIG_ID>|$PORTKEY_CONFIG_ID|g" \
              -e "s|<PORTKEY_CHAT_CONFIG_ID>|$PORTKEY_CHAT_CONFIG_ID|g" \
              -e "s|<GCP_PROJECT_ID>|$GCP_PROJECT_ID|g" \
              -e "s|<VERTEXAI_EMBEDDING_MODEL>|$VERTEXAI_EMBEDDING_MODEL|g" \
              -e "s|<LANGSMITH_PROJECT>|$LANGSMITH_PROJECT|g" \
              "$1" > "$2"
          }

          render .aws/task-definitions/rag-api.json    rag-api.json

      - name: Deploy rag-api
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: rag-api.json
          service: ${{ env.ECS_SERVICE_API }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true