name: CI

on:
  push:
    branches: [main, features, deployment]
  pull_request:
    branches: [main, features, deployment]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Lint with ruff
        run: |
          ruff check app tests evals
          ruff format --check app tests evals

      - name: Test with pytest
        env:
          LOGFIRE_IGNORE_NO_CONFIG: 1
          GROQ_API_KEY: dummy
          GROQ_MODEL: llama-3.3-70b-versatile
          PORTKEY_API_KEY: dummy
          PORTKEY_CONFIG_ID: pc-dummy
          PORTKEY_CHAT_CONFIG_ID: pc-chat-dummy
          QDRANT_CLUSTER_ENDPOINT: https://dummy.example.com
          QDRANT_API_KEY: dummy
          DATABASE_URL: postgresql://dummy:dummy@dummy.db:5432/dummy
          GCP_PROJECT_ID: dummy-gcp-project
          VERTEXAI_EMBEDDING_MODEL: gemini-embedding-004
          GEMINI_API_KEY: dummy
          RAG_API_KEY: dummy
        run: |
          pytest tests/